[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bonelli-ibm"
version = "0.1.0"
description = "Individual-Based Model (IBM) for Aquila fasciata in the Alpilles massif"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "pandas>=2.1",
    "pyarrow>=14.0",
]

[project.optional-dependencies]
gis = [
    "rasterio>=1.3",
    "xarray>=2024.1",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
