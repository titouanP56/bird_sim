# =============================================================================
#  Environnement : Massif des Alpilles (biome méditerranéen)
#  Toute la génération spatiale est pilotée par ce fichier (approche data-driven).
#  Convention de grille : [lignes (Nord -> Sud), colonnes (Ouest -> Est)]
# =============================================================================

biome_name: "Mediterranean - Alpilles"
grid_size: [50, 50]
cell_size_km: 0.5            # 1 case = 500m x 500m (25 ha) -> carte de 25 km x 25 km
seed: 42

# -----------------------------------------------------------------------------
#  TOPOGRAPHIE (Géomorphologie : Terrasses calcaires + Falaises fines NMS 1 case)
# -----------------------------------------------------------------------------
topography_types:
  0: { name: "Plaine",   min_elevation: 0.00, color: "#e6d8a8" }
  1: { name: "Plateau",  min_elevation: 0.28, color: "#c2a66b" }
  2: { name: "Versant",  min_elevation: 0.24, color: "#8a6a4a" }
  3: { name: "Falaise",  min_elevation: 0.22, color: "#4a4a52" }

topography_generation:
  # Crête principale orientée Est-Ouest au centre de la carte
  ridge_center: 0.5
  ridge_width: 0.11
  ridge_length: 0.80
  ridge_sinuosity: 0.05
  ridge_flatness: 1.45       # forme des plateaux calcaires sommitaux bien plats
  terrace_sharpness: 5.0     # accentue la rupture de pente (cuesta calcaire) sur les rebords

  # Couronne de plateaux autour du massif
  plateau_width: 0.25
  plateau_strength: 0.48

  # Bruit spatial (relief secondaire : vallons, combes)
  noise_sigma: 3.0
  noise_amplitude: 0.18

  # Seuils géomorphologiques (couple Altitude / Pente + NMS pour falaises de 1 case)
  upland_min_elevation: 0.28   # transition Plaine -> Plateau / Versant
  cliff_min_elevation: 0.22    # altitude minimale pour une barre rocheuse
  hill_slope_threshold: 0.032  # pente séparant un Plateau plat (1) d'un Versant (2)
  cliff_slope_threshold: 0.052 # seuil de rupture de pente pour extraire la ligne de Falaise (3)

# -----------------------------------------------------------------------------
#  VÉGÉTATION (fermeture du milieu, 0.0 = nu, 1.0 = fermé)
# -----------------------------------------------------------------------------
vegetation_strata:
  - { name: "Clairière / Roche", min: 0.0, max: 0.2 }
  - { name: "Garrigue",          min: 0.2, max: 0.6 }
  - { name: "Forêt / Pinède",    min: 0.6, max: 1.0 }

vegetation_generation:
  noise_sigma: 2.0
  noise_amplitude: 0.18
  smoothing_sigma: 0.8

vegetation_topography_rules:
  0: { mean: 0.42, variability: 1.5, min: 0.05, max: 0.95 }  # Plaine : cultures, friches, bosquets
  1: { mean: 0.30, variability: 0.8, min: 0.10, max: 0.58 }  # Plateau : garrigue ouverte calcaire
  2: { mean: 0.48, variability: 1.1, min: 0.15, max: 0.88 }  # Versant : pentes caillouteuses & pinèdes
  3: { mean: 0.06, variability: 0.3, min: 0.00, max: 0.18 }  # Falaise : paroi rocheuse

# -----------------------------------------------------------------------------
#  DYNAMIQUE ENVIRONNEMENTALE (Régénération & Effarouchement local)
# -----------------------------------------------------------------------------
prey_dynamics:
  regeneration_rate: 0.025   # taux de croissance logistique quotidien r

fear_dynamics:
  max_fear: 0.90             # plafond d'effarouchement d'une case
  neighbor_share: 0.0        # 1 case = 500m : la peur reste strictement locale à la case attaquée
  default_daily_decay: 0.12  # dissipation quotidienne naturelle

# -----------------------------------------------------------------------------
#  PROIES (Densités et affinités écologiques réelles)
# -----------------------------------------------------------------------------
prey_generation:
  noise_sigma: 2.0

preys:
  lapin:
    display_name: "Lapin de garenne"
    max_density: 12.0
    preferred_topography: { 0: 1.0, 1: 0.95, 2: 0.55, 3: 0.0 }
    optimal_vegetation: [0.18, 0.50]
    vegetation_tolerance: 0.12
    noise_amplitude: 0.20

  perdrix:
    display_name: "Perdrix rouge"
    max_density: 7.5
    preferred_topography: { 0: 0.70, 1: 1.0, 2: 0.90, 3: 0.10 }
    optimal_vegetation: [0.10, 0.45]
    vegetation_tolerance: 0.12
    noise_amplitude: 0.20

  lezard:
    display_name: "Lézard ocellé"
    max_density: 8.0
    preferred_topography: { 0: 0.40, 1: 1.0, 2: 0.80, 3: 0.20 }
    optimal_vegetation: [0.05, 0.35]
    vegetation_tolerance: 0.12
    noise_amplitude: 0.25

  pigeon:
    display_name: "Pigeon biset / Palombe"
    max_density: 6.0
    preferred_topography: { 0: 0.80, 1: 0.65, 2: 0.50, 3: 0.40 }
    optimal_vegetation: [0.05, 0.45]
    vegetation_tolerance: 0.20
    noise_amplitude: 0.15